<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GloApp | Becoming My Highest Self</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="p-4 pb-32">
    <div class="cloud-bg"></div>
    <div class="soft-overlay"></div>

    <div id="reward-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-md bg-white/90 text-purple-900 p-4 rounded-2xl shadow-2xl text-center animate-bounce font-serif border border-purple-200"></div>

    <header class="text-center py-12">
        <h1 class="cursive text-6xl text-purple-900 mb-2 drop-shadow-sm">GloApp</h1>
        <p class="serif italic text-sm tracking-[0.2em] text-purple-700/70 uppercase">becoming my highest self ✨</p>
    </header>

    <div class="max-w-2xl mx-auto space-y-12 relative z-10">
        <!-- TODAY'S FOCUS -->
        <section>
            <h2 class="serif text-2xl font-semibold mb-6 px-2 text-purple-900/80">Today's Focus ☁️</h2>
            <div id="goals-list" class="space-y-6"></div>
        </section>

        <!-- VISION BOARD -->
        <section>
            <h2 class="serif text-2xl font-semibold mb-6 px-2 text-purple-900/80">Vision Board 🎀</h2>
            <div id="vision-grid"></div>
        </section>

        <!-- GOAL COMMAND CENTER -->
        <section class="command-center p-8 rounded-[40px] border border-white/50 shadow-inner">
            <h2 class="serif text-2xl font-semibold mb-6 text-purple-900/80">Goals & Ambitions 🎯</h2>
            
            <div class="bg-white/40 backdrop-blur-md p-6 rounded-3xl border border-white/60 mb-8">
                <input id="new-goal-name" type="text" placeholder="Goal Title..." class="w-full bg-transparent p-2 mb-4 border-b border-purple-200 outline-none serif placeholder:italic">
                <div class="flex gap-3 mb-4">
                    <input id="new-goal-duration" type="number" placeholder="Days" class="w-24 bg-white/50 p-3 rounded-xl border border-purple-100 outline-none text-sm">
                    <select id="new-goal-reward" class="flex-1 bg-white/50 p-3 rounded-xl border border-purple-100 outline-none text-sm appearance-none"></select>
                </div>
                <div class="flex gap-3">
                    <button onclick="createNewGoal(true)" class="flex-1 btn-primary py-3 rounded-2xl text-xs font-bold uppercase tracking-widest">Start Now</button>
                    <button onclick="createNewGoal(false)" class="flex-1 btn-secondary py-3 rounded-2xl text-xs font-bold uppercase tracking-widest">Save for Future</button>
                </div>
            </div>

            <div id="future-goals-list" class="space-y-4"></div>
        </section>

        <!-- TREASURY -->
        <section>
            <div class="flex justify-between items-end mb-6 px-2">
                <h2 class="serif text-2xl font-semibold text-purple-900/80">Treasury 🎁</h2>
                <button onclick="addRewardPrompt()" class="text-[10px] tracking-widest uppercase bg-white/80 text-purple-600 px-4 py-2 rounded-full border border-purple-100 hover:bg-purple-50">+ Add Reward</button>
            </div>
            <div id="rewards-list" class="grid grid-cols-1 gap-4"></div>
        </section>
        
        <footer class="text-center py-10 opacity-60">
            <p class="serif italic text-xs">You are becoming everything you dreamed of. Keep going. ✨</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
