<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GloApp | Becoming My Highest Self</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-purple: #f3e8ff;
            --deep-purple: #9333ea;
            --accent-gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e0e7ff 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #4b2c6d;
            min-height: 100vh;
        }

        .cursive { font-family: 'Dancing Script', cursive; }

        .glo-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(147, 51, 234, 0.07);
        }

        .btn-primary {
            background: linear-gradient(to right, #a855f7, #7c3aed);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }

        .vision-slot {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            border: 2px dashed #d8b4fe;
            transition: transform 0.2s;
        }

        .vision-slot:hover { transform: scale(1.02); }

        .streak-fire {
            filter: drop-shadow(0 0 5px #fbbf24);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 2px #fbbf24); }
            to { filter: drop-shadow(0 0 8px #f59e0b); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 10px; }
    </style>
</head>

    <header class="text-center mb-8 pt-6">
        <h1 class="cursive text-5xl text-purple-800 mb-1">GloApp ✨</h1>
        <p class="text-sm tracking-widest uppercase opacity-70">becoming my highest self 🏹</p>
        <div class="mt-6 glo-card p-6 mx-auto max-w-lg italic text-lg">
            "Discipline today, freedom tomorrow. ☁️"
        </div>
    </header>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
        <div class="glo-card p-4 text-center">
            <p class="text-xs uppercase opacity-60">Streak</p>
            <p class="text-2xl font-bold">7 <span class="streak-fire">🔥</span></p>
        </div>
        <div class="glo-card p-4 text-center">
            <p class="text-xs uppercase opacity-60">Success</p>
            <p class="text-2xl font-bold">78% 🪄</p>
        </div>
        <div class="glo-card p-4 text-center">
            <p class="text-xs uppercase opacity-60">Check-ins</p>
            <p class="text-2xl font-bold">45 📖</p>
        </div>
        <div class="glo-card p-4 text-center">
            <p class="text-xs uppercase opacity-60">Longest</p>
            <p class="text-2xl font-bold">14 🏆</p>
        </div>
    </div>

                <button onclick="toggleModal('goal-modal')" class="text-sm text-purple-600 font-bold">+ New Goal</button>
            </div>
