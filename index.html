<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GloApp | Becoming My Highest Self</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="p-4 pb-32">
    <div id="reward-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-md bg-pink-500 text-white p-4 rounded-2xl shadow-2xl text-center animate-bounce font-bold">
        </div>

    <header class="text-center py-8">
        <h1 class="cursive text-5xl text-purple-800 mb-1">GloApp ✨</h1>
        <p class="text-sm tracking-widest uppercase opacity-60 italic">it's already yours</p>
    </header>

    <div class="max-w-2xl mx-auto space-y-12">
        <section>
            <h2 class="text-2xl font-semibold mb-4 px-2">Today's Focus ☁️</h2>
            <div id="goals-list" class="space-y-4"></div>
        </section>

        <section>
            <h2 class="text-2xl font-semibold mb-4 px-2">Vision Board 🎀</h2>
            <div id="vision-grid"></div>
        </section>

        <section class="bg-purple-100/30 p-6 rounded-[32px] border border-purple-200/50">
            <h2 class="text-2xl font-semibold mb-4">Goals & Ambitions 🎯</h2>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-purple-100 mb-6">
                <input id="new-goal-name" type="text" placeholder="Goal Name (e.g., 5K Steps)" class="w-full p-2 mb-3 border-b border-purple-50 outline-none text-sm">
                <div class="flex gap-2 mb-3">
                    <input id="new-goal-duration" type="number" placeholder="Days" class="w-20 p-2 rounded-lg border border-purple-50 outline-none text-sm">
                    <select id="new-goal-reward" class="flex-1 p-2 rounded-lg border border-purple-50 outline-none text-sm bg-white"></select>
                </div>
                <div class="flex gap-2">
                    <button onclick="createNewGoal(true)" class="flex-1 bg-purple-600 text-white py-2 rounded-xl text-xs font-bold">Start Now</button>
                    <button onclick="createNewGoal(false)" class="flex-1 bg-white border border-purple-200 text-purple-600 py-2 rounded-xl text-xs font-bold">Save for Future</button>
                </div>
            </div>

            <div id="future-goals-list" class="space-y-3">
                </div>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4 px-2">
                <h2 class="text-2xl font-semibold">Treasury 🎁</h2>
                <button onclick="addRewardPrompt()" class="text-xs bg-pink-400 text-white px-3 py-1 rounded-full">+ Add Reward</button>
            </div>
            <div id="rewards-list" class="grid grid-cols-1 gap-3"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
